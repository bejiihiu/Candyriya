name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Run checks
        run: chmod +x ./gradlew && ./gradlew check --parallel --stacktrace

      - name: Verify jar builds
        if: success()
        run: ./gradlew :launcher:shadowJar --parallel

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.sha }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7

      - name: Upload jar
        if: success() && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v4
        with:
          name: candyriya-${{ github.sha }}
          path: launcher/build/libs/candyriya.jar
          retention-days: 3
