name: Dependency Review

on:
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          allow-licenses: GPL-3.0, Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, CC0-1.0
