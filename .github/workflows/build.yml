# Velocity-compatible alias — mirrors ci.yml for badge compatibility
# PaperMC/Velocity uses .github/workflows/gradle.yml, we expose build.yml
name: Java CI with Gradle

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Build with Gradle
        run: chmod +x ./gradlew && ./gradlew build --parallel
