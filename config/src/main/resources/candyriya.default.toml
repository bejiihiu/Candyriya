# Candyriya proxy config - default template
# this file is copied to ./candyriya.toml on first run if missing
# edit values and restart the proxy :)

[network]
# address to bind, format host:port
bind = "0.0.0.0:25577"
# netty worker threads, 0 = 2 * cpu count
workers = 0
# read timeout in seconds, 0 = disabled
readTimeoutSeconds = 30

[protocol]
# max packet size in bytes (1..8388608)
maxPacketSize = 2097152
# compression threshold, -1 to disable
compressionThreshold = 256

[backend]
# single backend for now — like velocity's [servers] but simplified xd
# TODO: future Map<String, BackendConfig> when we add multi-backend support
host = "127.0.0.1"
port = 25565
# how long to wait for backend connect before giving up
connectTimeoutMs = 5000
# retry attempts on failure (0 = kick immediately, like you wanted xd)
retryAttempts = 0
# delay between retries
retryDelayMs = 500

[security]
onlineMode = false
forwardingSecret = ""
# NONE / LEGACY / BUNGEEGUARD / MODERN — modern is Velocity's HMAC thing
# big respect to PaperMC Velocity, we yoinked this straight from them <3
forwardingMode = "NONE"

[status]
# MOTD shown in server list — MiniMessage format (<green>, <gradient:#55FF55:#55FFFF>, etc.)
# see https://docs.advntr.dev/minimessage/format.html
motd = "<gradient:#55FF55:#55FFFF>Candyriya 26.1</gradient> <gray>—</gray> <white>proxy</white>"
maxPlayers = 100
versionName = "26.1"
versionProtocol = 775

[shutdown]
# quiet period for netty graceful shutdown (ms)
quietPeriodMs = 200
# timeout for netty graceful shutdown (ms)
timeoutMs = 5000

[logging]
# log level: TRACE, DEBUG, INFO, WARN, ERROR
level = "INFO"

[threads]
# use virtual threads for async pool (java 21+)
virtual = true
# core size for scheduled pool (platform threads)
scheduledCoreSize = 2
# parallelism for async pool when virtual=false, 0 = cpu count
asyncParallelism = 0

[scheduler]
# tick duration in ms (50ms = 20 tps, like Paper/Folia)
tickRateMs = 50
# number of execution contexts (like Folia regions) — players spread across them
# 0 = cpu count, max 32
contexts = 4
